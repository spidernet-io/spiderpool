                      address to its link-layer/pairing metadata. The key is the primary-family
                      address: IPv4 for v4/primary pools, and IPv6 only for a pure-v6
                      single-stack pool. Presence of a key in the decoded map IS the
                      ready state. Besides address keys, the map reserves the standalone
                      key "parentNic", whose string value is the pool-level parent
                      NIC name on the node this pool is bound to, from which the provider
                      derives sub-interfaces/sub-IPs.'
