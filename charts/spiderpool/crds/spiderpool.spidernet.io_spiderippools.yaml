                  pools. It is provider-owned: Spiderpool consumes it read-only and
                  never writes to it. For a paired (dual-stack) pool set, this field
                  exists only on the primary pool (by convention the v4 pool); the
                  sibling pool''s own ipMetaData is left empty by the provider. Presence
                  of an address as a key in Metadata IS the ready state; prewarm failure
                  is expressed purely as absence from Metadata (counted in UnreadyIPCount),
                  with per-IP failure detail in provider logs only.'
